[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "roottrace-poc"
version = "0.1.0"
description = "Independent proof of concept for reproducible plant root trait quality monitoring"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["roottrace*"]
